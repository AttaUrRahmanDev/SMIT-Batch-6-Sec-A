{% extends 'base.html' %}
{% block content %}
<h2>{{ participant.id if participant else 'Add' }} Participant</h2>
<form method="POST">
<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" value="{{ participant.name if participant else '' }}" required>
</div>
<button type="submit" class="btn btn-success">Save</button>
</form>
{% endblock %}
