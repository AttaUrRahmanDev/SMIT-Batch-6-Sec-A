{% extends 'base.html' %}
{% block content %}
<h2>Stores</h2>
<a href="{{ url_for('add_store') }}" class="btn btn-primary mb-3">Add Store</a>
<table class="table table-striped">
<thead><tr><th>#</th><th>Name</th><th>Actions</th></tr></thead>
<tbody>
{% for store in stores %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ store.name }}</td>
<td>
<a href="{{ url_for('edit_store', id=store.id) }}" class="btn btn-sm btn-warning">Edit</a>
<a href="{{ url_for('delete_store', id=store.id) }}" class="btn btn-sm btn-danger">Delete</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
