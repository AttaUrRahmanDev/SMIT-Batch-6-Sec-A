<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* NAVBAR */
        .navbar {
            background: #2d3436;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .navbar button {
            background: #0984e3;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .navbar button:hover {
            background: #74b9ff;
        }

        /* DASHBOARD GRID */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            grid-gap: 25px;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
            color: #0984e3;
        }

        /* FOOTER */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: #dfe6e9;
            font-size: 14px;
            color: #555;
        }
    </style>

    <script>
        function go(url) {
            window.location.href = url;
        }
    </script>

</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h1>📦 Store Management Dashboard</h1>
        <button onclick="go('/logout')">Logout</button>
    </div>

    <!-- DASHBOARD -->
    <div class="container">

        <div class="card" onclick="go('product/add')">
            <div class="icon">➕</div>
            <h2>Add Product</h2>
        </div>

        <div class="card" onclick="go('/products')">
            <div class="icon">📄</div>
            <h2>View Products</h2>
        </div>

        <div class="card" onclick="go('/add_purchase')">
            <div class="icon">🛒</div>
            <h2>New Purchase</h2>
        </div>

        <div class="card" onclick="go('/sales')">
            <div class="icon">💸</div>
            <h2>Sales Entry</h2>
        </div>

        <div class="card" onclick="go('/reports')">
            <div class="icon">📊</div>
            <h2>Reports</h2>
        </div>

        <div class="card" onclick="go('/suppliers')">
            <div class="icon">🚚</div>
            <h2>Suppliers</h2>
        </div>

        <div class="card" onclick="go('/customers')">
            <div class="icon">👥</div>
            <h2>Customers</h2>
        </div>

        <div class="card" onclick="go('/store-settings')">
            <div class="icon">⚙️</div>
            <h2>Settings</h2>
        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        Store Management System © {{ current_year }}
    </footer>

</body>
</html>
