{% extends 'base.html' %}
{% block content %}
<h2>Participants</h2>
<a href="{{ url_for('add_participant') }}" class="btn btn-primary mb-3">Add Participant</a>

<table class="table table-striped">
<thead><tr><th>#</th><th>Name</th><th>Actions</th></tr></thead>
<tbody>
{% for participant in participants %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ participant.name }}</td>
<td>
<a href="{{ url_for('edit_participant', id=participant.id) }}" class="btn btn-sm btn-warning">Edit</a>
<a href="{{ url_for('delete_participant', id=participant.id) }}" class="btn btn-sm btn-danger">Delete</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
