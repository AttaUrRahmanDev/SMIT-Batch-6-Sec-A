{% extends 'base.html' %}
{% block title %}Add Purchase{% endblock %}

{% block content %}
<h2 class="mb-4">📦 Add Product & Purchase</h2>

<form method="POST">

  <!-- 🔹 PRODUCT DETAILS -->
   <div class="card mb-4 p-3 shadow-sm">
    <h4 class="mb-3">Product Details</h4>

    <div class="mb-3">
      <label>Product Name </label>
      <input type="text" name="product_name" class="form-control" value="{{ product.product_code  if product else '' }}" required>
    </div>
  <div class="card mb-4 p-3 shadow-sm">
    <h4 class="mb-3">Product Details</h4>

    <div class="mb-3">
      <label>Product Code</label>
      <input type="text" name="product_code" class="form-control" value="{{ product.product_code if product else '' }}" required>
    </div>

    <div class="mb-3">
      <label>IMEI</label>
      <input type="text" name="imei" class="form-control" value="{{ product.imei if product else '' }}">
    </div>

    <div class="mb-3">
      <label>Category</label>
      <input type="text" name="category" class="form-control" value="{{ product.category if product else '' }}" required>
    </div>

    <div class="mb-3">
      <label>Buy Price</label>
      <input type="number" step="0.01" name="buy_price" class="form-control" value="{{ product.buy_price if product else '' }}" required>
    </div>

    <div class="mb-3">
      <label>Sell Price</label>
      <input type="number" step="0.01" name="sell_price" class="form-control" value="{{ product.sell_price if product else '' }}" required>
    </div>

    <div class="mb-3">
      <label>Stock</label>
      <input type="number" name="stock" class="form-control" value="{{ product.stock if product else 0 }}" required>
    </div>
  </div>

  <!-- 🔹 PURCHASE DETAILS -->
  <div class="card p-3 shadow-sm">
    <h4 class="mb-3">Purchase Details</h4>

    <div class="mb-3">
      <label>Supplier</label>
      <select name="supplier_id" class="form-control" required>
        <option value="">-- Select supplier --</option>
        {% for s in suppliers %}
          <option value="{{ s.id }}" {% if product and product.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Quantity</label>
      <input type="number" name="quantity" class="form-control" min="1" required>
    </div>

    <div class="mb-3">
      <label>Unit Price</label>
      <input type="number" step="0.01" name="unit_price" class="form-control" required>
    </div>
  </div>

  <button type="submit" class="btn btn-success mt-3">💾 Save Product & Purchase</button>
</form>
{% endblock %}
