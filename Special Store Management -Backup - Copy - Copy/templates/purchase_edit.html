


{% extends 'base.html' %}
{% block title %}Add Purchase{% endblock %}

{% block content %}

<h2 class="mb-4">📦 Add Product & Purchase</h2>

<form method="POST">

  <!-- 🔹 PRODUCT DETAILS -->
  <div class="card mb-4 p-3 shadow-sm">
    <h4 class="mb-3">Product Details</h4>

    <!-- Product Name -->
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input
        type="text"
        name="product_name"
        class="form-control"
        value="{{ product.name if product else '' }}"
        required
      >
    </div>

    <!-- Product Code -->
    <div class="mb-3">
      <label class="form-label">Product Code</label>
      <input
        type="text"
        name="product_code"
        class="form-control"
        value="{{ product.product_code if product else '' }}"
        required
      >
    </div>

    <!-- IMEI -->
    <div class="mb-3">
      <label class="form-label">IMEI</label>
      <input
        type="text"
        name="imei"
        class="form-control"
        value="{{ product.imei if product else '' }}"
      >
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">Category</label>
      <input
        type="text"
        name="category"
        class="form-control"
        value="{{ product.category if product else '' }}"
        required
      >
    </div>

    <!-- Buy Price -->
    <div class="mb-3">
      <label class="form-label">Buy Price</label>
      <input
        type="number"
        step="0.01"
        name="buy_price"
        class="form-control"
        value="{{ product.buy_price if product else '' }}"
        required
      >
    </div>

    <!-- Sell Price -->
    <div class="mb-3">
      <label class="form-label">Sell Price</label>
      <input
        type="number"
        step="0.01"
        name="sell_price"
        class="form-control"
        value="{{ product.sell_price if product else '' }}"
        required
      >
    </div>

    <!-- Stock -->
    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input
        type="number"
        name="stock"
        class="form-control"
        value="{{ product.calculated_stock if product else 0 }}"
        required
      >
    </div>

  </div>

  <!-- 🔹 PURCHASE DETAILS -->
  <div class="card p-3 shadow-sm">
    <h4 class="mb-3">Purchase Details</h4>

    <!-- Supplier -->
    <div class="mb-3">
      <label class="form-label">Supplier</label>

      <select name="supplier_id" class="form-control" required>
        <option value="">-- Select Supplier --</option>

        {% for s in suppliers %}
          <option
            value="{{ s.id }}"
            {% if product and product.supplier_id == s.id %}selected{% endif %}
          >
            {{ s.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Quantity -->
    <div class="mb-3">
      <label class="form-label">Quantity</label>
      <input
        type="number"
        name="quantity"
        class="form-control"
        min="1"
        required
      >
    </div>

    <!-- Unit Price -->
    <div class="mb-3">
      <label class="form-label">Unit Price</label>
      <input
        type="number"
        step="0.01"
        name="unit_price"
        class="form-control"
        required
      >
    </div>

  </div>

  <!-- Submit -->
  <button type="submit" class="btn btn-success mt-3">
    💾 Save Product & Purchase
  </button>

</form>

{% endblock %}
