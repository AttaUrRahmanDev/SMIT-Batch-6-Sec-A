{% extends 'base.html' %}

{% block title %}Edit Cashier{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-4">✏️ Edit Cashier</h3>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Cashier Name</label>
              <input type="text" name="name" class="form-control" value="{{ cashier.name }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" value="{{ cashier.username }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success">Save Changes</button>
              <a href="{{ url_for('cashier_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
