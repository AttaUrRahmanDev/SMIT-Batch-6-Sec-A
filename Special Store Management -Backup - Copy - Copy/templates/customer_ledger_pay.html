{% extends 'base.html' %}
{% block title %}Receive Payment{% endblock %}
{% block content %}
<h2>Receive Payment</h2>

<div class="mb-3">
  <strong>{{ ledger.customer.name }}</strong> — <small class="text-muted">{{ ledger.customer.customer_number }}</small>
  <div>Due: <strong>{{ '%.2f'|format(ledger.due_amount) }}</strong></div>
</div>

<form method="POST" class="card p-3">
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Amount Received</label>
      <input name="received_amount" type="number" step="0.01" class="form-control" required max="{{ ledger.due_amount }}">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Payment Date</label>
      <input name="paid_at" type="datetime-local" class="form-control" value="{{ now.strftime('%Y-%m-%dT%H:%M') }}" >
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Note</label>
      <input name="note" class="form-control" placeholder="optional">
    </div>
  </div>

  <button class="btn btn-success">Save Payment</button>
  <a class="btn btn-secondary" href="{{ url_for('customer_ledger_list') }}">Back</a>
</form>
{% endblock %}
