{% extends 'base.html' %}
{% block title %}Add Supplier Credit/Due{% endblock %}
{% block content %}
<h2>Add Supplier Credit / Due</h2>

<form method="POST" class="card p-3">
  <div class="mb-3">
    <label class="form-label">Supplier Name</label>
    <input name="supplier_name" class="form-control" placeholder="Supplier name" value="{{ supplier_name or '' }}" required>
    <div class="form-text">If supplier doesn't exist, it will be created.</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Supplier Phone (optional)</label>
    <input name="supplier_phone" class="form-control" placeholder="Phone" value="{{ supplier_phone or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Supplier Location (optional)</label>
    <input name="supplier_location" class="form-control" placeholder="Location" value="{{ supplier_location or '' }}">
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Reference Type</label>
      <select name="reference_type" class="form-select">
        <option value="purchase" selected>purchase</option>
        <option value="manual">manual</option>
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Reference ID (optional)</label>
      <input name="reference_id" class="form-control" placeholder="e.g. purchase id">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Due Date (optional)</label>
      <input name="due_date" class="form-control" type="datetime-local">
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Total Amount</label>
      <input name="total_amount" type="number" step="0.01" class="form-control" required>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Paid Amount (optional)</label>
      <input name="paid_amount" type="number" step="0.01" class="form-control" value="0">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Note</label>
      <input name="note" class="form-control" placeholder="optional">
    </div>
  </div>

  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('supplier_ledger_list') }}">Cancel</a>
</form>
{% endblock %}
