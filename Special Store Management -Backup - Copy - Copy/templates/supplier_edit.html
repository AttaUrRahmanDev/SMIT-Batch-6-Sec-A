{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Supplier #' ~ supplier.id if supplier else 'Add Supplier' }}</h2>

<form method="POST">
  <div class="mb-3">
    <label for="name" class="form-label">Supplier Name</label>
    <input type="text" id="name" name="name" class="form-control"
           value="{{ supplier.name if supplier else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="phone" class="form-label">Phone</label>
    <input type="text" id="phone" name="phone" class="form-control"
           value="{{ supplier.phone if supplier else '' }}">
  </div>
  <div class="mb-3">
    <label for="location" class="form-label">Location</label>
    <input type="text" id="location" name="location" class="form-control"
           value="{{ supplier.phone if supplier else '' }}">
  </div>

  <button type="submit" class="btn btn-success">Save</button>
  <a href="{{ url_for('supplier_list') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
