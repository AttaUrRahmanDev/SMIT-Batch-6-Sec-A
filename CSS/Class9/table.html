<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
        /* border-radius: 10px; */

      }
      table {
        border: 1px solid black;
        width: 50%;
        height: 80vh;
        border-collapse: collapse;
        /* align-items: center; */
        /* border-collapse: separate;; */
        /* background-color: rgb(119, 0, 255); */
        margin: 10px auto;
        
      }

      th,
      td {
        /* border: 1px solid black; */
        /* height: 40px; */
        /* width: 100px; */
        text-align: center;
        padding: 10px;
        /* color:rgb(0, 255, 128); */
      }
      th {
        text-align: left;
        color: rgb(242, 242, 243);
        background-color: rgb(0, 0, 0);
      }
      tr {
        border-bottom: 1px solid black;
        /* border-radius: 10px; */
      }
      /* td:hover{
        background-color: rgb(0, 0, 0);
        color: rgb(242, 242, 243);
      } */

      tr:hover {
        background-color: rgb(0, 0, 0);
        color: rgb(242, 242, 243);
      }
      tr:nth-child(even):hover {
        background-color: rgb(146, 143, 139);
        color: rgb(242, 242, 243);
      }
      /* tr:nth-child(even):hover{
        background-color: rgb(0, 0, 0);
        color: rgb(242, 242, 243);
      } */
      tr {
        transition: 0.3s;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>S.no</th>
        <th>Name</th>
        <th>Course</th>
        <th>Time</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Test</td>
        <td>Mern</td>
        <td>9 to 11</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Test</td>
        <td>Mern</td>
        <td>9 to 11</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Test</td>
        <td>Mern</td>
        <td>9 to 11</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Test</td>
        <td>Mern</td>
        <td>9 to 11</td>
      </tr>
    </table>
  </body>
</html>
