<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Banner</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Internal CSS */
        body{
            background-color: rgba(135, 47, 47, 0.1);
        }

        p{
            color: blue;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>

</head>
<body>

    <div class="container">

        <img src="images/logo.png" alt="Company Logo" class="logo">

        <h2>Company Name</h2>

        <!-- Inline CSS -->
        <h1 style="color:red;">
            Welcome To Our Website
        </h1>

        <!-- Inline CSS -->
        <p style="font-style:italic;">
            We provide software solutions for businesses.
        </p>

        <p>
            Our mission is to create simple and useful applications.
        </p>

    </div>

</body>
</html>
