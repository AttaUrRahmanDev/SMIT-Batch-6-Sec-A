<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>CSS Position</title>
    <style>
      .section {
        width: 300px;
        height: 300px;
        border: 1px solid;

        /* background-color: blue; */
      }
      .section_1 {
        background-color: lightblue;
        /* position: relative;
        top: 10px;
        left: 30px; */
        /* z-index:0; */
      }
      .parent {
        position: relative;
        width: 500px;
        height: 500px;
        background-color: aqua;
      }
      .section_2 {
        background-color: rebeccapurple;
        position: absolute;
        /* z-index:0; */
        top: 50px;
        right: 50px;
      }
      .section_3 {
        background-color: rgb(133, 155, 194);
        position: fixed;
        bottom: 50px;
        right: 50px;
        width: 50px;
        height: 50px;
      }
      ul {
        background-color: blanchedalmond;
        padding: 10px 0;
        position: sticky;
        top: 0px;
        z-index: 2;
      }
      ul > li {
        display: inline-block;
        padding: 5px;
        border-radius: 5px;
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <div class="section_1 section"></div>
    <ul>
      <li>Link 1</li>
      <li>Link 2</li>
      <li>Link 3</li>
      <li>Link 4</li>
    </ul>x
    <div class="parent">
      <div class="section_2 section"></div>
    </div>
    <div class="section_3 section"></div>
    <div class="section_4 section"></div>
    <div class="section_5 section"></div>
  </body>
</html>
