<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .section {
        width: 200px;
        height: 200px;
        border: 1px solid;
      }
      .section_1 {
        background-color: red;
      }
      .section_2 {
        background-color: green;
      }
      .section_3 {
        background-color: blue;
      }
      .section_4 {
        background-color: black;
      }
      .product_card {
        width: 300px;
        height: 400px;
        border: 1px solid;
        border-radius: 10px;
        margin: auto;
        position: relative;
      }
      .product_card > img {
        width: 100%;
        height: 250px;
        border-radius: 10px 10px 0 0;
      }
      .product_detail {
        padding: 10px;
      }
      .product_detail > button {
        width: 100%;
        padding: 5px 0;
        border-radius: 5px;
        border: none;
        font-size: 18px;
      }
      .product_detail > button:hover {
        background-color: green;
        color: white;
      }
      #heart {
        height: 50px;
        width: 50px;
        border: 1px;
        display: block;
        position: absolute;
        top: 10px;
        right: 10px;
      }
    </style>
  </head>
  <body>
    <!-- <div class="section_1 section"></div>
    <div class="section_2 section"></div>
    <div class="section_3 section"></div>
    <div class="section_4 section"></div> -->
    <div class="product_card">
      <img
        src="images/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTExL3BmLXMxMDgtcG0tNDExMy1tb2NrdXAuanBn.webp"
        alt="Product"
      />
      <img src="images/favorite.png" alt="Favorite Icon" id="heart" />
      <div class="product_detail">
        <h2>Product Title</h2>
        <p>Lorem ipsum dolor sit amet.</p>
        <button>Add To Cart</button>
      </div>
    </div>
  </body>
</html>
