<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask Submissions</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <h1>Saved Flask Form Data</h1>

    <p><a href="/">Back to Form</a></p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Password</th>
          <th>Gender</th>
          <th>Class</th>
        </tr>
      </thead>

      <tbody>
        {% if students1 %} {% for s in students1 %}
        <tr>
          <td>{{ s.id }}</td>
          <td>{{ s.name }}</td>
          <td>{{ s.email }}</td>
          <td>{{ s.password }}</td>
          <td>{{ s.gender }}</td>
          <td>{{ s.class_name }}</td>
        </tr>
        {% endfor %} {% else %}

        <tr>
          <td colspan="6" style="text-align: center;">No submissions yet.</td>
        </tr>

        {% endif %}
      </tbody>
    </table>
  </body>
</html>
