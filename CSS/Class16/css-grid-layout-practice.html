<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grids</title>
    <style>
              .container{
                  width: 90vw;
                  height: 90vh;
                  border: 1px solid #000;
                  display: grid;
                  grid-template-rows: repeat(3,1fr);
                  grid-template-columns: repeat(3,1fr);
                  /* grid-template-columns: 1fr 1fr 1fr; */
                  gap: 10px;
                  

              }
              .grid-item{
                  /* width: 100px;
                  height: 100px; */
                  border: 1px solid #BBB09B;
                  border-radius: 10px;
                  background:  #BBB09B;
                  box-shadow: 5px 5px 20px rgb(78, 140, 119);
                  box-sizing: border-box;
                  
              }
              .grid-item:hover{
                  background: #3E2A35;
                  transform: scale(1.01);
                  transition: 1s;
                  /* animation: forwards 1s timing-function delay iteration-count direction fill-mode; */
                 
              }
             
              .grid-item-6{
                  grid-column-start: 1;
                  grid-column-end: 3;
              }
              .grid-item-3{
                  grid-column-start: 3;
                  grid-column-end:3;
                  grid-row-start: 1;
                  grid-row-end:4;

              }
      .grid-item-
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-item grid-item-1"></div>
      <div class="grid-item grid-item-2"></div>
      <div class="grid-item grid-item-3"></div>
      <div class="grid-item grid-item-4"></div>
      <div class="grid-item grid-item-5"></div>
      <div class="grid-item grid-item-6"></div>
    </div>
  </body>
</html>
